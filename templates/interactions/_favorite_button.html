{% load i18n %}
<div class="favorite-box">
  <form
    method="post"
    hx-post="{% url 'interactions:favorite' content.id %}"
    hx-target="#favorite-button"
    hx-swap="innerHTML"
  >
    {% csrf_token %}
    <button class="button button-ghost favorite-button{% if is_favorited %} is-active{% endif %}" type="submit">
      <svg class="favorite-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.74 0 3.41 1.01 4.22 2.55C11.09 5.01 12.76 4 14.5 4 17 4 19 6 19 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"
        ></path>
      </svg>
      <span>
        {% if is_favorited %}
          {% trans "Favorited" %}
        {% else %}
          {% trans "Favorite" %}
        {% endif %}
      </span>
    </button>
  </form>
</div>
