{% load i18n %}
<form method="post" action="{% url 'blog:create' %}" class="blog-create-form">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="{{ form.title.id_for_label }}">{% trans "Title" %}</label>
    {{ form.title }}
  </div>
  <div class="mb-3">
    <label class="form-label" for="{{ form.summary.id_for_label }}">{% trans "Summary" %}</label>
    {{ form.summary }}
  </div>
  <div class="mb-3">
    <label class="form-label" for="{{ form.hero_image_url.id_for_label }}">{% trans "Hero image URL" %}</label>
    {{ form.hero_image_url }}
  </div>
  <div class="row g-3">
    <div class="col-12 col-md-6">
      <label class="form-label" for="{{ form.status.id_for_label }}">{% trans "Status" %}</label>
      {{ form.status }}
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label" for="{{ form.published_at.id_for_label }}">{% trans "Publish at" %}</label>
      {{ form.published_at }}
    </div>
  </div>
  <div class="d-flex justify-content-end gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{% trans "Close" %}</button>
    <button type="submit" class="btn btn-primary">{% trans "Create & edit blocks" %}</button>
  </div>
</form>
