{% load static i18n %}

<div
  class="lego-viewer"
  data-lego-viewer
  data-model-url="{{ model_url }}"
  data-parts-path="{% url 'library:ldraw-index' %}"
  data-zoom-enabled="{{ zoom_enabled|yesno:'true,false' }}"
  data-three-base="{{ LEGO_THREE_BASE_URL }}"
>
  <div class="lego-viewer-toolbar">
    <button class="button button-ghost" type="button" data-lego-flip>{% trans "Flip" %}</button>
    <button class="button button-ghost" type="button" data-lego-fit>{% trans "Fit" %}</button>
    <button class="button button-ghost" type="button" data-lego-reset>{% trans "Reset" %}</button>
  </div>
  <div class="lego-viewer-stage">
    <canvas class="lego-viewer-canvas" data-lego-canvas></canvas>
    <div class="lego-viewer-status" data-lego-status data-level="loading" data-visible="true">
      <div class="lego-viewer-status-card">
        <span class="lego-viewer-status-label" data-lego-status-text>{% trans "Loading 3D model..." %}</span>
      </div>
    </div>
  </div>
  {% if not zoom_enabled %}
    {% if request.LANGUAGE_CODE == "vi" %}
      <p class="lego-viewer-note">Mở khóa để xem chi tiết, thu phóng to nhỏ và điều chỉnh góc nhìn.</p>
    {% else %}
      <p class="lego-viewer-note">Unlock to zoom in, view details, and adjust the camera.</p>
    {% endif %}
  {% endif %}
  <noscript>
    <p class="field-hint">{% trans "Enable JavaScript to view this 3D model." %}</p>
  </noscript>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "{{ LEGO_THREE_BASE_URL }}/build/three.module.js"
    }
  }
</script>
<script type="module" src="{% static 'js/lego_viewer.js' %}"></script>
<script>
  window.setTimeout(function () {
    document.querySelectorAll("[data-lego-viewer]").forEach(function (root) {
      if (root.dataset.legoBound === "true") {
        return;
      }
      var status = root.querySelector("[data-lego-status]");
      if (!status) {
        return;
      }
      var textNode = status.querySelector("[data-lego-status-text]") || status;
      textNode.textContent =
        "3D viewer chưa chạy. Kiểm tra tải static (/static/js/lego_viewer.js) và Console lỗi module.";
      status.dataset.level = "error";
      status.dataset.visible = "true";
    });
  }, 2500);
</script>
