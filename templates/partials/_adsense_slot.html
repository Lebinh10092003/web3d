{% if ADSENSE_CLIENT and slot %}
  <div class="ad-slot{% if class_name %} {{ class_name }}{% endif %}">
    <ins
      class="adsbygoogle"
      style="display:block"
      data-ad-client="{{ ADSENSE_CLIENT }}"
      data-ad-slot="{{ slot }}"
      data-ad-format="auto"
      data-full-width-responsive="true"
    ></ins>
  </div>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
{% endif %}
