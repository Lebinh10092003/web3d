---
# Format:
# ""
#   legoid:
#     usecolor: <index of the color used to paint the ldr part>
#     colors:
#       - # where
#         <LEGO color id>: <ldr part file> [OW]
#       …
#     decorations:
#       <lxf decorations field>: <ldr part file> [rotation]
#       …
# ""
#
# Decorations beat colors.
#
# Color zones are tested in order.  One color, one replacement.
# Once a replacement is found, it’s not changed unless next replacement has
# option “OW“.
#
# <rotation> is one of x, xx, xxx, y, yy, yyy, z, zz, zzz
#            or x#, y#, z# where # is a positive integer
# meaning resp. 90° around x, 180° around x, 270° around x, … y, … z
#           and #° around x, … y, …z
#
# Example:
# 12895:
#   colors:
#     - # hat
#     - # visor
#       26: 12895p01.dat # black
#       308: 12895p03.dat # dark brown
#     - # chin strap
#       297: 12895p01.dat # gold
#       310: 12895p01.dat # gold
#       21: 12895p02.dat OW # red
#       309: 12895p04.dat # silver
#       315: 12895p04.dat # silver
# reads as:
#   main color is the first one (defaults to 0)
#   hat color doesn’t lead to any replacement
#   if visor color is black or dark brown, replace with p01 or p03
#   otherwise
#     if chin strap color is gold or silver, replace with p01 or p04
#   but if chin strap color is red, replace with p02 anyway


