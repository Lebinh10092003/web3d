---
# Format:
#
# ""
# <legoid>:
#   type: <LSynth type>
#   head: <h> <Transformation>
#   body: <h>,<t> <Transformation>
#   tail: <t> <Transformation>
#   head+: <datfile> <Transformation>
#   tail+: <datfile> <Transformation>
# ""
#
# A transformation is 7 comma-separated floats (tx,ty,tz,ax,ay,az,angle) (no spaces)
# For body, h and t are the number of bones to skip at each end.
# For head (and tail), h (and t), is the number of bones to place as transformed.
# E.g.
# 64230:                               # Hose 8.5L
#   type: HOSE_FLEXIBLE_8.5L           # 
#   head: 1 0.72,0,0,0,0,1,-90         # replace skipped head bone
#   tail: 0                            # don’t replace skipped tail bone
#   body: 1,1 0,0,0,0,0,1,-90          # skip one head and one tail
#   head+: 752.dat 0.72,0,0,0,0,1,-90  # add head cap on first bone
#   tail+: 752.dat 0,0,0.72,1,0,0,90   # add tail cap on last bone

